[project]
authors = [{name = "Roeland Nieboer", email = "roeland.nieboer@deltares.nl"}]
dependencies = []
name = "UrbanVibe"
requires-python = ">= 3.11"
version = "0.1.0"

[project.scripts]
obs-filter = "urbanvibe.cli:main"
h5-reader = "urbanvibe.h5_reader:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
urbanvibe = { path = ".", editable = true }

[tool.pixi.tasks]
obs_filter = { cmd = "python -m urbanvibe.cli", description = "Filter observations by bbox & time, export shapefile, show QC plot" }
h5_reader = { cmd = "python -m urbanvibe.h5_reader --help", description = "Inspect FEBUS HDF5 reader CLI usage" }
test = { cmd = "pytest -q", description = "Run unit tests" }

[tool.pixi.dependencies]
python = ">=3.14.6,<3.15"
pandas = ">=3.0.3,<4"
openpyxl = ">=3.1.5,<4"
geopandas = ">=1.1.4,<2"
matplotlib = ">=3.11.0,<4"
contextily = ">=1.7.1,<2"
pytest = ">=8.4.2,<9"
